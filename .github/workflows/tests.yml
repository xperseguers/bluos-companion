name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Home Assistant 2025.6, the oldest supported
            python: "3.13"
            requirements: requirements_test_oldest.txt
          - name: latest Home Assistant
            python: "3.14"
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install the test requirements
        run: pip install -r ${{ matrix.requirements }}
      - name: Run the tests
        run: pytest -q
